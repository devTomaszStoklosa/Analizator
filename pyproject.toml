[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "analizator"
version = "0.1.0"
description = "Multi-agent bull/bear research pipeline for US stocks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "httpx",
    "duckdb",
    "pydantic>=2",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["analizator*"]

[tool.setuptools.package-data]
analizator = ["agents/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
